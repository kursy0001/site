<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stardew oynayalım mı çıtır şey?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #ffe3f1;
    --bg2: #ffbedc;
    --bg3: #ff9ecb;
    --glow: rgba(255, 255, 255, .85);
    --card: rgba(255, 255, 255, .62);
    --card-done: rgba(255, 255, 255, .38);
    --card-border: rgba(255, 255, 255, .95);
    --card-shadow: rgba(214, 36, 122, .28);
    --title: #d6247a;
    --tshadow1: rgba(255, 255, 255, .95);
    --tshadow2: rgba(214, 36, 122, .35);
    --text: #9b1d5c;
    --green: #43d15f;
    --green-dark: #1f9d3c;
    --red: #e5383b;
    --red-dark: #a4161a;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #3b0f2d;
      --bg2: #58143f;
      --bg3: #7c1a58;
      --glow: rgba(255, 130, 190, .25);
      --card: rgba(70, 18, 52, .62);
      --card-done: rgba(70, 18, 52, .4);
      --card-border: rgba(255, 170, 215, .35);
      --card-shadow: rgba(0, 0, 0, .45);
      --title: #ffc2e2;
      --tshadow1: rgba(160, 27, 99, .9);
      --tshadow2: rgba(0, 0, 0, .4);
      --text: #ffc2e2;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #3b0f2d;
    --bg2: #58143f;
    --bg3: #7c1a58;
    --glow: rgba(255, 130, 190, .25);
    --card: rgba(70, 18, 52, .62);
    --card-done: rgba(70, 18, 52, .4);
    --card-border: rgba(255, 170, 215, .35);
    --card-shadow: rgba(0, 0, 0, .45);
    --title: #ffc2e2;
    --tshadow1: rgba(160, 27, 99, .9);
    --tshadow2: rgba(0, 0, 0, .4);
    --text: #ffc2e2;
  }

  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100%;
    min-height: 100%;
    overflow-x: hidden;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(60% 45% at 50% 38%, var(--glow), transparent 70%),
      linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- katmanlar ---------- */
  .layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #hearts, #ambient { z-index: 0; }
  #garden { z-index: 1; }
  #petals { z-index: 4; }

  /* yükselen kalpler */
  .float-heart {
    position: absolute;
    bottom: -40px;
    opacity: 0;
    animation: rise var(--dur, 9s) linear forwards;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0) scale(.6) rotate(-8deg); opacity: 0; }
    10%  { opacity: var(--o, .7); }
    50%  { transform: translate(var(--dx, 20px), -55vh) scale(1) rotate(8deg); }
    100% { transform: translate(calc(var(--dx, 20px) * -1), -115vh) scale(1.1) rotate(-6deg); opacity: 0; }
  }

  /* süs çiçekleri */
  .amb { position: absolute; }
  .sway { animation: sway var(--sd, 4s) ease-in-out var(--sl, 0s) infinite; transform-origin: 50% 60%; }
  @keyframes sway {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(7deg); }
  }
  .spin { animation: spin 40s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- sahne ---------- */
  main {
    position: relative;
    z-index: 3;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
  }

  .card {
    width: 100%;
    max-width: 36rem;
    padding: clamp(28px, 6vw, 48px) clamp(20px, 5vw, 44px) clamp(28px, 6vw, 44px);
    text-align: center;
    background: var(--card);
    border: 3px solid var(--card-border);
    border-radius: 44px;
    box-shadow: 0 24px 60px var(--card-shadow), inset 0 2px 0 rgba(255,255,255,.6);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    animation: cardIn .9s cubic-bezier(.2, 1.4, .4, 1) both;
    transition: background .6s ease;
  }
  .card.done {
    background: var(--card-done);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  @keyframes cardIn {
    from { transform: scale(.7) translateY(30px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .sprout {
    width: clamp(78px, 22vw, 110px);
    height: auto;
    margin: 0 auto 6px;
    display: block;
    animation: bob 3s ease-in-out infinite;
    filter: drop-shadow(0 8px 10px rgba(214, 36, 122, .35));
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-9px) rotate(3deg); }
  }
  .sprout .leafL { transform-origin: 30px 22px; animation: leaf 2.4s ease-in-out infinite; }
  .sprout .leafR { transform-origin: 34px 22px; animation: leaf 2.4s ease-in-out .3s infinite reverse; }
  @keyframes leaf { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }

  h1 {
    margin: 4px 0 6px;
    font-family: "Pacifico", "Brush Script MT", cursive;
    font-weight: 400;
    font-size: clamp(2.5rem, 12.5vw, 5.2rem);
    line-height: 1.12;
    color: var(--title);
    text-shadow: 0 3px 0 var(--tshadow1), 0 8px 20px var(--tshadow2);
    text-wrap: balance;
  }

  .hint {
    min-height: 1.5em;
    margin: 0 0 20px;
    font-size: clamp(.95rem, 3.6vw, 1.1rem);
    font-weight: 500;
  }

  .answers {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* büyük yeşil EVET */
  .yes {
    position: relative;
    overflow: hidden;
    width: min(100%, 24rem);
    padding: clamp(18px, 4.5vw, 26px) 20px;
    font: 700 clamp(1.35rem, 6vw, 2rem)/1.1 "Fredoka", system-ui, sans-serif;
    letter-spacing: .02em;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0, 80, 20, .35);
    background: linear-gradient(180deg, #62e37c, var(--green) 55%, #2fb84b);
    border: 0;
    border-bottom: 7px solid var(--green-dark);
    border-radius: 999px;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 14px 30px rgba(31, 157, 60, .45), inset 0 3px 0 rgba(255, 255, 255, .45);
    animation: pulse 1.8s ease-in-out infinite;
    transition: transform .15s ease, border-bottom-width .15s ease;
  }
  .yes::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: -60%;
    width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent);
    transform: skewX(-20deg);
    animation: shine 3.2s ease-in-out 1s infinite;
  }
  @keyframes shine { 0% { left: -60%; } 40%, 100% { left: 140%; } }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 14px 30px rgba(31, 157, 60, .45), 0 0 0 0 rgba(67, 209, 95, .55), inset 0 3px 0 rgba(255,255,255,.45); }
    50%      { transform: scale(1.04); box-shadow: 0 18px 36px rgba(31, 157, 60, .5), 0 0 0 16px rgba(67, 209, 95, 0), inset 0 3px 0 rgba(255,255,255,.45); }
  }
  .yes:hover { transform: scale(1.07); }
  .yes:active { transform: scale(.97); border-bottom-width: 3px; }

  /* küçük kırmızı hayır */
  .no-holder { display: inline-block; }
  .no {
    padding: 6px 14px;
    font: 600 .8rem/1 "Fredoka", system-ui, sans-serif;
    color: #fff;
    background: var(--red);
    border: 0;
    border-bottom: 3px solid var(--red-dark);
    border-radius: 999px;
    cursor: pointer;
    touch-action: manipulation;
    white-space: nowrap;
    z-index: 6;
  }
  .no.moving {
    position: fixed;
    margin: 0;
    transform-origin: 50% 50%;
  }
  .no.gone { opacity: 0; pointer-events: none; }

  :focus-visible { outline: 4px solid #ffd23f; outline-offset: 4px; }

  /* ---------- YUPİİİ ---------- */
  .yay[hidden] { display: none; }
  .yay h2 {
    margin: 0 0 8px;
    font-family: "Pacifico", "Brush Script MT", cursive;
    font-weight: 400;
    font-size: clamp(3rem, 17vw, 6.6rem);
    line-height: 1.15;
    color: var(--title);
    text-shadow: 0 3px 0 var(--tshadow1), 0 10px 24px var(--tshadow2);
    white-space: nowrap;
  }
  .yay h2 span {
    display: inline-block;
    animation: letter 1.15s ease-in-out infinite, letterIn .7s cubic-bezier(.2, 1.8, .4, 1) both;
    animation-delay: calc(var(--i) * .08s), calc(var(--i) * .06s);
  }
  @keyframes letter { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
  @keyframes letterIn { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { opacity: 1; } }
  .yay p {
    margin: 0 0 18px;
    font-size: clamp(1.1rem, 4.6vw, 1.5rem);
    font-weight: 600;
  }
  .again {
    font: 500 .85rem "Fredoka", system-ui, sans-serif;
    color: var(--text);
    background: transparent;
    border: 2px dashed currentColor;
    border-radius: 999px;
    padding: 6px 14px;
    opacity: .7;
    cursor: pointer;
  }
  .again:hover { opacity: 1; }

  /* ---------- çiçek bahçesi ---------- */
  .gf { position: absolute; }
  .pop { animation: bloom .95s cubic-bezier(.2, 1.7, .4, 1) var(--d, 0s) both; }
  @keyframes bloom {
    0%   { transform: scale(0) rotate(-120deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .tall { position: absolute; bottom: 0; width: 0; }
  .stem {
    position: absolute;
    bottom: 0; left: -3px;
    width: 6px; height: 100%;
    background: linear-gradient(180deg, #58d36e, #2b9b47);
    border-radius: 6px;
    transform-origin: bottom;
    animation: grow 1.1s cubic-bezier(.3, 1.2, .5, 1) var(--d, 0s) both;
  }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .leaf {
    position: absolute;
    width: 26px; height: 15px;
    background: #48c764;
    border-radius: 0 100% 0 100%;
    opacity: 0;
    animation: leafIn .5s ease calc(var(--d, 0s) + .7s) both;
  }
  .leaf.l { left: -26px; transform: rotate(-20deg) scaleX(-1); }
  .leaf.r { left: 3px; transform: rotate(-20deg); }
  @keyframes leafIn { from { opacity: 0; scale: 0; } to { opacity: 1; scale: 1; } }
  .head {
    position: absolute;
    left: 0; top: 0;
    width: 0; height: 0;
  }
  .head > .pop {
    position: absolute;
    left: calc(var(--s) / -2);
    top: calc(var(--s) / -2);
    width: var(--s);
    height: var(--s);
    animation-delay: calc(var(--d, 0s) + .8s);
  }

  /* düşen taç yapraklar */
  .petal {
    position: absolute;
    top: -30px;
    border-radius: 100% 0 100% 0;
    opacity: .9;
    animation: fall var(--dur, 9s) linear var(--del, 0s) infinite;
  }
  @keyframes fall {
    0%   { transform: translate(0, -10vh) rotate(0); }
    50%  { transform: translate(var(--dx, 40px), 55vh) rotate(180deg); }
    100% { transform: translate(calc(var(--dx, 40px) * -.5), 115vh) rotate(400deg); }
  }

  .confetti { position: fixed; z-index: 9; pointer-events: none; left: 0; top: 0; }

  svg { display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div id="hearts" class="layer" aria-hidden="true"></div>
<div id="ambient" class="layer" aria-hidden="true"></div>
<div id="garden" class="layer" aria-hidden="true"></div>
<div id="petals" class="layer" aria-hidden="true"></div>

<main>
  <section class="card" id="card">
    <div id="ask">
      <svg class="sprout" viewBox="0 0 64 64" aria-hidden="true">
        <path class="leafL" d="M30 22 C20 22 12 15 10 6 C21 6 29 12 30 22Z" fill="#5fd36f"/>
        <path class="leafR" d="M34 22 C44 22 52 15 54 6 C43 6 35 12 34 22Z" fill="#3fbf5a"/>
        <path d="M32 60 C4 40 8 22 20 22 C26 22 30 25 32 29 C34 25 38 22 44 22 C56 22 60 40 32 60Z" fill="#ff4d94"/>
        <path d="M18 30 C18 27 21 25 24 26" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>

      <h1 id="title">Stardew oynayalım mı çıtır şey?</h1>
      <p class="hint" id="hint" aria-live="polite">&nbsp;</p>

      <div class="answers">
        <button class="yes" id="yes" type="button">EVET OYNAYALIM</button>
        <span class="no-holder" id="noHolder"><button class="no" id="no" type="button">hayır</button></span>
      </div>
    </div>

    <div class="yay" id="yay" hidden>
      <h2 id="yayTitle" aria-label="yupiiii!!!"></h2>
       <p> </p>
      <p>Çiftliğe gidiyoruz, hazırlan! 🌱💗</p>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (s) { return document.querySelector(s); };
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };

  var card = $("#card"), ask = $("#ask"), yay = $("#yay");
  var yes = $("#yes"), no = $("#no"), holder = $("#noHolder"), hint = $("#hint"), title = $("#title");
  var garden = $("#garden"), petals = $("#petals"), ambient = $("#ambient"), heartsLayer = $("#hearts");

  var PINKS = ["#ff7eb6", "#ff4d94", "#ffb3d1", "#ff8fa3", "#ffc2e2", "#ffffff", "#ffd166", "#c77dff", "#ff6b9d"];
  var HEARTS = ["#ff4d94", "#ff7eb6", "#ff9ecb", "#ffffff", "#e5383b", "#ffb3d1"];

  /* ---------- SVG üreticiler ---------- */
  function heartSVG(color, size) {
    return '<svg width="' + size + '" height="' + (size * 0.94) + '" viewBox="0 0 32 30" aria-hidden="true">' +
      '<path fill="' + color + '" d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12.1 16-21.2C32 3.8 28.2 0 23.6 0z"/>' +
      '<path d="M6 8c0-2 1.6-3.4 3.4-3.4" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
  }

  function flowerSVG(color) {
    var kind = pick(["ellipse", "round", "daisy"]);
    var n = kind === "round" ? 5 : (kind === "daisy" ? 10 : pick([6, 8]));
    var out = '<svg viewBox="-50 -50 100 100" width="100%" height="100%" aria-hidden="true">';
    for (var i = 0; i < n; i++) {
      var rot = (360 / n) * i;
      if (kind === "round") {
        out += '<circle cx="0" cy="-23" r="16" fill="' + color + '" transform="rotate(' + rot + ')"/>';
      } else if (kind === "daisy") {
        out += '<ellipse cx="0" cy="-29" rx="6" ry="19" fill="' + color + '" transform="rotate(' + rot + ')"/>';
      } else {
        out += '<ellipse cx="0" cy="-25" rx="12" ry="21" fill="' + color + '" transform="rotate(' + rot + ')"/>' +
               '<ellipse cx="0" cy="-30" rx="4.5" ry="10" fill="#fff" fill-opacity=".35" transform="rotate(' + rot + ')"/>';
      }
    }
    var center = color === "#ffd166" ? "#ff7a59" : "#ffd23f";
    out += '<circle r="12" fill="' + center + '"/><circle cx="-3" cy="-3" r="4" fill="#fff" fill-opacity=".55"/>' +
           '<circle cx="4" cy="3" r="1.6" fill="#c9821b" fill-opacity=".6"/></svg>';
    return out;
  }

  /* ---------- yükselen kalpler ---------- */
  function spawnHeart() {
    if (document.hidden) return;
    var d = document.createElement("div");
    var size = rand(14, 34);
    d.className = "float-heart";
    d.style.left = rand(2, 96) + "%";
    d.style.setProperty("--dur", rand(8, 14) + "s");
    d.style.setProperty("--dx", rand(-40, 40) + "px");
    d.style.setProperty("--o", rand(.35, .8).toFixed(2));
    d.innerHTML = heartSVG(pick(HEARTS), size);
    d.addEventListener("animationend", function () { d.remove(); });
    heartsLayer.appendChild(d);
  }

  /* ---------- kenarlardaki süs çiçekleri ---------- */
  function buildAmbient() {
    ambient.innerHTML = "";
    var W = window.innerWidth, H = window.innerHeight;
    var n = Math.max(4, Math.ceil(W / 120));
    for (var i = 0; i < n; i++) {
      var s = rand(70, 120);
      var a = document.createElement("div");
      a.className = "amb";
      a.style.width = a.style.height = s + "px";
      a.style.left = ((i + .5) / n * W - s / 2 + rand(-20, 20)) + "px";
      a.style.bottom = (-s * rand(.25, .45)) + "px";
      a.innerHTML = '<div class="sway" style="--sd:' + rand(3.5, 5.5).toFixed(2) + 's;--sl:' + (-rand(0, 4)).toFixed(2) + 's;width:100%;height:100%">' + flowerSVG(pick(PINKS)) + '</div>';
      ambient.appendChild(a);
    }
    [[-30, -30], [W - 70, -36]].forEach(function (pos) {
      var s = rand(110, 150);
      var a = document.createElement("div");
      a.className = "amb";
      a.style.width = a.style.height = s + "px";
      a.style.left = pos[0] + "px";
      a.style.top = pos[1] + "px";
      a.innerHTML = '<div class="spin" style="width:100%;height:100%">' + flowerSVG(pick(["#ff7eb6", "#ffb3d1", "#ffffff"])) + '</div>';
      ambient.appendChild(a);
    });
  }

  /* ---------- HAYIR butonu ---------- */
  var noClicks = 0, MAX = 6, baseW = 0, baseH = 0;
  var hints = [
    "hmm, emin misin? 🥺",
    "butonu yakalayabilecek misin bakalım",
    "bence bir daha düşün 💗",
    "hayır kaçıyor, evet hep burada",
    "hayır neredeyse kayboldu…"
  ];

  function pickSpot(w, h, curX, curY) {
    var vw = window.innerWidth, vh = window.innerHeight;
    var m = Math.max(w, h) / 2 + 12;
    var avoid = [yes, title].map(function (el) {
      var r = el.getBoundingClientRect();
      return { l: r.left - 16, r: r.right + 16, t: r.top - 16, b: r.bottom + 16 };
    });
    var best = null;
    for (var i = 0; i < 80; i++) {
      var cx = m + Math.random() * Math.max(1, vw - 2 * m);
      var cy = m + Math.random() * Math.max(1, vh - 2 * m);
      var b = { l: cx - w / 2, r: cx + w / 2, t: cy - h / 2, b: cy + h / 2 };
      var hit = avoid.some(function (a) { return b.l < a.r && b.r > a.l && b.t < a.b && b.b > a.t; });
      var far = Math.hypot(cx - curX, cy - curY) > Math.min(vw, vh) * 0.25;
      if (!hit && far) return { cx: cx, cy: cy };
      if (!hit && !best) best = { cx: cx, cy: cy };
    }
    return best || { cx: m, cy: m };
  }

  no.addEventListener("click", function () {
    if (noClicks >= MAX) return;
    noClicks++;

    if (noClicks === 1) {
      var r = no.getBoundingClientRect();
      baseW = r.width; baseH = r.height;
      holder.style.width = baseW + "px";
      holder.style.height = baseH + "px";
      no.style.width = baseW + "px";
      no.style.height = baseH + "px";
      no.classList.add("moving");
      no.style.left = r.left + "px";
      no.style.top = r.top + "px";
      void no.offsetWidth;
      no.style.transition = "left .6s cubic-bezier(.34,1.56,.64,1), top .6s cubic-bezier(.34,1.56,.64,1), transform .6s cubic-bezier(.34,1.56,.64,1), opacity .5s ease";
    }

    var scale = Math.pow(0.68, noClicks);
    var cur = no.getBoundingClientRect();
    var spot = pickSpot(baseW * scale, baseH * scale, cur.left + cur.width / 2, cur.top + cur.height / 2);
    no.style.left = (spot.cx - baseW / 2) + "px";
    no.style.top = (spot.cy - baseH / 2) + "px";
    no.style.transform = "scale(" + scale + ")";

    if (noClicks >= MAX) {
      hint.textContent = "hayır seçeneği kalmadı 💖 tek yol: evet";
      no.classList.add("gone");
      no.setAttribute("aria-hidden", "true");
      no.tabIndex = -1;
      setTimeout(function () { no.style.visibility = "hidden"; }, 600);
    } else {
      hint.textContent = hints[noClicks - 1];
    }
  });

  /* ---------- EVET → yupiiii ---------- */
  function buildYayTitle() {
    var t = $("#yayTitle");
    t.innerHTML = "";
    "yupiiii!!!".split("").forEach(function (ch, i) {
      var s = document.createElement("span");
      s.textContent = ch;
      s.style.setProperty("--i", i);
      s.setAttribute("aria-hidden", "true");
      t.appendChild(s);
    });
  }

  function burstHearts(x, y) {
    if (reduce || !document.body.animate) return;
    for (var i = 0; i < 34; i++) {
      var d = document.createElement("div");
      d.className = "confetti";
      d.innerHTML = heartSVG(pick(HEARTS), rand(14, 32));
      document.body.appendChild(d);
      var ang = rand(0, Math.PI * 2), dist = rand(120, Math.min(420, window.innerWidth * 0.9));
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 60;
      var rot = rand(-200, 200);
      var anim = d.animate([
        { transform: "translate(" + x + "px," + y + "px) scale(.2) rotate(0deg)", opacity: 1 },
        { transform: "translate(" + (x + dx) + "px," + (y + dy) + "px) scale(1.1) rotate(" + rot + "deg)", opacity: 1, offset: .6 },
        { transform: "translate(" + (x + dx * 1.1) + "px," + (y + dy + 140) + "px) scale(.9) rotate(" + (rot * 1.4) + "deg)", opacity: 0 }
      ], { duration: rand(1100, 1900), easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" });
      anim.onfinish = (function (el) { return function () { el.remove(); }; })(d);
    }
  }

  function bloomGarden(ox, oy) {
    garden.innerHTML = "";
    var W = window.innerWidth, H = window.innerHeight;
    var maxDist = Math.hypot(Math.max(ox, W - ox), Math.max(oy, H - oy));

    // 1) her yere dağılmış çiçekler (kaydırmalı ızgara)
    var cell = W < 500 ? 78 : 96;
    var cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var s = rand(cell * .55, cell * 1.05);
        var x = (c + .5) * cell + rand(-cell * .35, cell * .35) - s / 2;
        var y = (r + .5) * cell + rand(-cell * .35, cell * .35) - s / 2;
        var dist = Math.hypot(x + s / 2 - ox, y + s / 2 - oy);
        var g = document.createElement("div");
        g.className = "gf";
        g.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + s + "px;height:" + s + "px;";
        g.innerHTML = '<div class="pop" style="--d:' + (dist / maxDist * 1.5).toFixed(2) + 's;width:100%;height:100%">' +
          '<div class="sway" style="--sd:' + rand(3, 5.5).toFixed(2) + 's;--sl:' + (-rand(0, 4)).toFixed(2) + 's;width:100%;height:100%">' +
          flowerSVG(pick(PINKS)) + '</div></div>';
        garden.appendChild(g);
      }
    }

    // 2) alttan uzayan saplı çiçekler
    var n = Math.ceil(W / (W < 500 ? 62 : 80));
    for (var i = 0; i < n; i++) {
      var h = rand(H * .12, Math.min(H * .42, 320));
      var sz = rand(52, 84);
      var px = (i + .5) / n * W + rand(-16, 16);
      var d0 = (i / n) * .9 + rand(0, .3);
      var t = document.createElement("div");
      t.className = "tall";
      t.style.cssText = "left:" + px + "px;height:" + h + "px;--d:" + d0.toFixed(2) + "s;";
      t.innerHTML = '<div class="stem"></div>' +
        '<div class="leaf l" style="bottom:' + (h * .35) + 'px"></div>' +
        '<div class="leaf r" style="bottom:' + (h * .55) + 'px"></div>' +
        '<div class="head" style="--s:' + sz + 'px"><div class="pop"><div class="sway" style="--sd:' + rand(3, 5).toFixed(2) + 's;width:100%;height:100%">' +
        flowerSVG(pick(PINKS)) + '</div></div></div>';
      garden.appendChild(t);
    }

    // 3) düşen taç yapraklar
    petals.innerHTML = "";
    if (!reduce) {
      for (var p = 0; p < 28; p++) {
        var pe = document.createElement("div");
        var ps = rand(9, 17);
        pe.className = "petal";
        pe.style.cssText = "left:" + rand(0, 100) + "%;width:" + ps + "px;height:" + (ps * 1.3) + "px;background:" + pick(["#ffb3d1", "#ff7eb6", "#ffc2e2", "#ffffff"]) +
          ";--dur:" + rand(7, 13).toFixed(1) + "s;--del:" + (-rand(0, 12)).toFixed(1) + "s;--dx:" + rand(-70, 70).toFixed(0) + "px;";
        petals.appendChild(pe);
      }
    }
  }

  yes.addEventListener("click", function () {
    var r = yes.getBoundingClientRect();
    var ox = r.left + r.width / 2, oy = r.top + r.height / 2;

    no.style.visibility = "hidden";
    no.tabIndex = -1;
    ask.hidden = true;
    yay.hidden = false;
    card.classList.add("done");
    buildYayTitle();
    bloomGarden(ox, oy);
    burstHearts(ox, oy);
    setTimeout(function () { burstHearts(window.innerWidth / 2, window.innerHeight * .4); }, 650);
    $("#again").focus({ preventScroll: true });
  });

  $("#again").addEventListener("click", function () {
    noClicks = 0;
    no.removeAttribute("style");
    no.removeAttribute("aria-hidden");
    no.className = "no";
    no.tabIndex = 0;
    holder.removeAttribute("style");
    hint.innerHTML = "&nbsp;";
    garden.innerHTML = "";
    petals.innerHTML = "";
    card.classList.remove("done");
    yay.hidden = true;
    ask.hidden = false;
  });

  /* ---------- başlat ---------- */
  buildAmbient();
  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(buildAmbient, 250);
  });

  if (!reduce) {
    for (var k = 0; k < 8; k++) setTimeout(spawnHeart, k * 250);
    setInterval(spawnHeart, 700);
  }
})();
</script>
</body>
</html>
